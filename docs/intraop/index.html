<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="minimal-table.css">
    <title>Intra-op</title>
  </head>
  <body>
    <div id="filters">
      <fieldset>
        <legend>Phases</legend>
        <span id="phase-choices"></span>
        <button type="button" id="all-phases">All phases</button>

      </fieldset>
      <fieldset>
        <legend>Types</legend>
        <label><input type="checkbox" data-type="check" checked> Checks</label>
        <label><input type="checkbox" data-type="milestone" checked> Milestones</label>
        <label><input type="checkbox" data-type="step" checked> Steps</label>
        <label><input type="checkbox" data-type="alert" checked> Alerts</label>
        <label><input type="checkbox" id="details" checked> Show details</label>
      </fieldset>
    </div>
    <p id="status" role="status"></p>
    <h3>Intra-op</h3>
    <div id="table-container"></div>
    <script src="js/import-document.js?v=4"></script>
    <script src="js/set-up-table.js?v=4"></script>
  </body>
</html>
